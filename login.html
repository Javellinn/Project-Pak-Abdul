<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — CINEMAXE</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- ================================================
       AUTH PAGE — LOGIN
       ================================================ -->
  <div class="auth-page">
    <div class="auth-container">

      <!-- Logo -->
      <div class="auth-header">
        <div class="auth-logo">CINEMA<span>XE</span></div>
        <p class="auth-subtitle">Pengalaman Bioskop Terbaik</p>
      </div>

      <!-- Card -->
      <div class="auth-card">
        <h2>Masuk</h2>
        <p class="auth-desc">Selamat datang kembali! Masuk untuk melanjutkan.</p>

        <!-- Alert (opsional, tampilkan jika ada error) -->
        <!-- <div class="alert alert-danger">Email atau kata sandi salah. Coba lagi.</div> -->

        <form action="index.html" method="get">

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="nama@email.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Kata Sandi</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                placeholder="Masukkan kata sandi"
                required
              />
              <span class="input-icon">🔒</span>
            </div>
          </div>

          <div class="form-group" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; text-transform:none; letter-spacing:0; font-size:13px; color:var(--text-muted); margin:0;">
              <input type="checkbox" name="remember" style="accent-color: var(--accent-red);" />
              Ingat saya
            </label>
            <a href="#" style="font-size:13px;">Lupa kata sandi?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">
            Masuk ke Akun
          </button>

        </form>

        <div class="auth-divider">atau</div>

        <a href="index.html" class="btn btn-secondary btn-block" style="text-align:center; padding:12px;">
          Lanjut sebagai Tamu 👤
        </a>

        <div class="auth-footer">
          Belum punya akun? <a href="register.html">Daftar sekarang</a>
        </div>
      </div>

      <!-- Footer kecil -->
      <div style="text-align:center; margin-top:28px; font-size:11px; color:var(--text-dim); letter-spacing:1px;">
        &copy; 2025 CINEMAXE &nbsp;·&nbsp; <a href="#">Privasi</a> &nbsp;·&nbsp; <a href="#">Syarat</a>
      </div>

    </div>
  </div>

</body>
</html>
